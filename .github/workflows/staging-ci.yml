name: Frontend Staging CI/CD

on:
  pull_request:
    branches: ["staging"]
  push:
    branches: ["staging"]

concurrency:
  group: sustain-insight-fe-staging-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  APP_NAME: sustain-insight-fe

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL }}
        run: npm run build

  build:
    name: Build Image
    if: ${{ github.event_name == 'push' }}
    needs: validate
    runs-on: ubuntu-latest
    env:
      VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment variables
        run: |
          if [ -z "${VITE_BACKEND_URL:-}" ]; then
            echo "Repository variable VITE_BACKEND_URL is required" >&2
            exit 1
          fi

      - name: Derive deployment metadata
        run: |
          echo "IMAGE_REPO=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          echo "DEPLOY_TAG=stg" >> "$GITHUB_ENV"
          echo "CONTAINER_NAME=${APP_NAME}-stg" >> "$GITHUB_ENV"
          echo "NETWORK_ALIAS=${APP_NAME}-stg" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            -f Dockerfile.staging \
            --build-arg VITE_BACKEND_URL="$VITE_BACKEND_URL" \
            -t "$IMAGE_REPO:$DEPLOY_TAG" \
            -t "$IMAGE_REPO:${GITHUB_SHA::7}" \
            .

      - name: Push image
        run: |
          docker push "$IMAGE_REPO:$DEPLOY_TAG"
          docker push "$IMAGE_REPO:${GITHUB_SHA::7}"

  deploy:
    name: Deploy
    if: ${{ github.event_name == 'push' }}
    needs: build
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_USER: ${{ secrets.SSH_USER }}
      NPM_NET_NAME: ${{ vars.NPM_NET_NAME }}

    steps:
      - name: Derive deployment metadata
        run: |
          echo "IMAGE_REPO=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          echo "DEPLOY_TAG=stg" >> "$GITHUB_ENV"
          echo "CONTAINER_NAME=${APP_NAME}-stg" >> "$GITHUB_ENV"
          echo "NETWORK_ALIAS=${APP_NAME}-stg" >> "$GITHUB_ENV"

      - name: Validate SSH settings
        run: |
          if [ -z "${SSH_HOST:-}" ]; then echo "SSH_HOST secret is required" >&2; exit 1; fi
          if [ -z "${SSH_USER:-}" ]; then echo "SSH_USER secret is required" >&2; exit 1; fi
          if [ -z "${SSH_PRIVATE_KEY:-}" ]; then echo "SSH_PRIVATE_KEY secret is required" >&2; exit 1; fi
          if [ -z "${SSH_PORT:-}" ] || ! echo "$SSH_PORT" | grep -Eq '^[0-9]+$'; then
            echo "SSH_PORT must be a numeric repository secret" >&2
            exit 1
          fi

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy container
        run: |
          SSH_OPTS="-i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes"
          ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "NPM_NET_NAME='${NPM_NET_NAME:-npm_default}' IMAGE='$IMAGE_REPO:$DEPLOY_TAG' CONTAINER_NAME='$CONTAINER_NAME' NETWORK_ALIAS='$NETWORK_ALIAS' bash -s" <<'EOF_REMOTE'
          set -euo pipefail

          if ! command -v docker >/dev/null 2>&1; then
            echo "Docker is required on the target server" >&2
            exit 1
          fi

          if ! docker network inspect "$NPM_NET_NAME" >/dev/null 2>&1; then
            docker network create --driver bridge "$NPM_NET_NAME"
          fi

          docker pull "$IMAGE"
          docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
          docker run -d \
            --name "$CONTAINER_NAME" \
            --network "$NPM_NET_NAME" \
            --network-alias "$NETWORK_ALIAS" \
            --restart unless-stopped \
            "$IMAGE"

          docker image prune -f
          EOF_REMOTE
